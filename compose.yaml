name: kafka-formation
services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 1000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
  app:
    build: .
    profiles: [tools]
    working_dir: /workspace
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      OTEL_TRACES_EXPORTER: none
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - app-state:/state
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [node, src/cli.ts]
volumes:
  kafka-data:
  app-state:
